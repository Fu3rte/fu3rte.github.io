<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 880" width="100%" height="100%">
  <defs>
    <style>
      .stroke-main { stroke: #111111; stroke-linecap: round; stroke-linejoin: round; }
      .skin { fill: #ffffff; stroke: #111111; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .shirt { fill: #1c1a1e; stroke: #111111; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .pants { fill: #4c779f; stroke: #111111; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .pants-shadow { fill: #395f83; }
      .cuff { fill: #5b87b0; stroke: #111111; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .shoe { fill: #ffffff; stroke: #111111; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
      .sole { fill: #f3f3f0; stroke: #111111; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="235" cy="855" rx="145" ry="14" fill="#e8e7e3" />

  <!-- Left Stick Leg -->
  <rect class="skin" x="187" y="700" width="16" height="125" rx="8" />

  <!-- Right Stick Leg -->
  <rect class="skin" x="276" y="695" width="16" height="130" rx="8" />

  <!-- Left Shoe (Profile) -->
  <g id="left-shoe">
    <path class="shoe" d="M 183 812 L 156 830 C 143 838 132 843 124 849 C 120 854 121 860 126 864 C 140 870 175 873 218 867 C 222 865 223 858 219 850 L 214 815 Z" />
    <path class="sole" d="M 124 855 C 140 863 175 866 218 860 L 219 868 C 175 874 140 871 123 862 Z" />
    <path d="M 148 834 C 140 844 135 852 135 858" class="stroke-main" stroke-width="4.5" fill="none" />
    <!-- Laces -->
    <line x1="168" y1="822" x2="176" y2="832" class="stroke-main" stroke-width="4.5" />
    <line x1="176" y1="817" x2="184" y2="827" class="stroke-main" stroke-width="4.5" />
    <line x1="184" y1="812" x2="192" y2="822" class="stroke-main" stroke-width="4.5" />
    <circle cx="168" cy="823" r="2.5" fill="#111111" />
    <circle cx="176" cy="818" r="2.5" fill="#111111" />
    <circle cx="184" cy="813" r="2.5" fill="#111111" />
  </g>

  <!-- Right Shoe (Frontal Angle) -->
  <g id="right-shoe">
    <path class="shoe" d="M 273 816 C 268 835 264 855 265 868 C 265 876 272 882 288 882 C 304 882 312 876 312 868 C 313 855 308 835 303 816 Z" />
    <ellipse class="shoe" cx="288" cy="815" rx="16" ry="7" />
    <path class="shoe" d="M 280 812 C 285 802 293 802 297 812" />
    <path class="sole" d="M 264 864 C 264 876 273 883 288 883 C 304 883 313 876 313 864 C 313 871 304 876 288 876 C 273 876 264 871 264 864 Z" />
    <!-- Laces -->
    <line x1="277" y1="830" x2="299" y2="830" class="stroke-main" stroke-width="4" />
    <line x1="276" y1="842" x2="301" y2="842" class="stroke-main" stroke-width="4" />
    <line x1="275" y1="854" x2="302" y2="854" class="stroke-main" stroke-width="4" />
    <path d="M 270 864 C 280 860 297 860 307 864" class="stroke-main" stroke-width="4" fill="none" />
  </g>

  <!-- Shorts (Base) -->
  <g id="shorts">
    <path class="pants" d="M 158 555
                           L 155 708
                           L 233 708
                           L 230 625
                           L 246 702
                           L 326 696
                           L 305 545
                           Z" />
    <!-- Shadows & Inseam details -->
    <path class="pants-shadow" d="M 216 708 L 233 708 L 230 625 L 218 625 Z" />
    <path class="pants-shadow" d="M 230 625 L 246 702 L 263 700 L 241 625 Z" />
    
    <!-- Fly Stitching -->
    <path d="M 228 575 L 228 625" class="stroke-main" stroke-width="4.5" fill="none" />
    <path d="M 234 578 L 234 612 C 234 622 228 625 222 624" class="stroke-main" stroke-width="4.5" fill="none" />
    
    <!-- Creases -->
    <path d="M 224 628 C 216 638 204 646 194 650" class="stroke-main" stroke-width="3.5" fill="none" />
    <path d="M 232 631 C 240 641 252 648 262 650" class="stroke-main" stroke-width="3.5" fill="none" />

    <!-- Side Seams -->
    <line x1="162" y1="580" x2="160" y2="708" class="stroke-main" stroke-width="3.5" />
    <line x1="298" y1="570" x2="320" y2="698" class="stroke-main" stroke-width="3.5" />

    <!-- Pocket Slits -->
    <path d="M 158 565 C 164 585 178 600 196 602" class="stroke-main" stroke-width="5" fill="none" />
    <path d="M 258 562 C 262 582 278 595 296 595" class="stroke-main" stroke-width="5" fill="none" />

    <!-- Cuffs -->
    <path class="cuff" d="M 152 702 L 236 702 C 235 717 234 724 233 730 L 154 730 C 153 724 152 717 152 702 Z" />
    <line x1="153" y1="716" x2="235" y2="716" class="stroke-main" stroke-width="2.5" opacity="0.4" />
    
    <path class="cuff" d="M 243 695 L 329 690 C 328 705 327 714 325 721 L 245 726 C 244 717 243 707 243 695 Z" />
    <line x1="244" y1="710" x2="327" y2="705" class="stroke-main" stroke-width="2.5" opacity="0.4" />
  </g>

  <!-- Left Stick Arm (Into Pocket) -->
  <path class="skin" d="M 166 415 L 157 566 L 172 566 L 180 415 Z" />

  <!-- Right Stick Arm (Into Pocket) -->
  <path class="skin" d="M 296 410 L 264 572 L 278 574 L 310 410 Z" />

  <!-- Neck -->
  <rect class="skin" x="226" y="240" width="18" height="48" />

  <!-- Oversized Black T-Shirt -->
  <g id="shirt">
    <path class="shirt" d="M 218 283
                          C 204 292 188 300 172 308
                          L 142 442
                          L 194 412
                          C 180 460 172 505 168 545
                          C 192 574 225 584 260 578
                          C 285 572 302 555 310 528
                          C 300 480 296 440 294 416
                          L 338 428
                          L 290 296
                          C 278 288 266 284 254 283
                          C 246 292 226 292 218 283
                          Z" />
    <!-- Collar Line -->
    <path d="M 218 283 C 224 293 248 293 254 283" class="stroke-main" stroke-width="5" fill="none" />
    
    <!-- Folds & Shading Lines -->
    <path d="M 252 425 C 242 465 228 498 208 528" stroke="#111111" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <path d="M 284 450 C 274 490 270 525 284 550" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 185 548 C 220 575 255 570 280 540" stroke="#111111" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 168 335 C 163 370 160 400 154 425" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 302 330 C 310 365 318 395 325 418" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- Head -->
  <circle class="skin" cx="236" cy="168" r="86" />

  <!-- Hair (Three Tufts) -->
  <path d="M 222 86 C 208 76 192 68 182 62" class="stroke-main" stroke-width="6.5" fill="none" />
  <path d="M 233 83 C 228 55 218 38 206 24" class="stroke-main" stroke-width="6.5" fill="none" />
  <path d="M 242 84 C 246 64 246 48 245 38" class="stroke-main" stroke-width="6.5" fill="none" />

  <!-- Face Details -->
  <!-- Left Eyebrow (Quizzical / Angled Up) -->
  <path d="M 178 152 C 186 148 200 135 210 133" class="stroke-main" stroke-width="6" fill="none" />

  <!-- Right Eyebrow (Curved Arch) -->
  <path d="M 244 135 C 253 127 268 128 278 135" class="stroke-main" stroke-width="6" fill="none" />

  <!-- Left Eye -->
  <ellipse cx="202" cy="174" rx="10" ry="14.5" transform="rotate(-14 202 174)" fill="#111111" />

  <!-- Right Eye -->
  <ellipse cx="262" cy="163" rx="10" ry="14" transform="rotate(4 262 163)" fill="#111111" />

  <!-- Mouth (Smirk) -->
  <path d="M 228 226 C 246 226 262 217 272 203" class="stroke-main" stroke-width="6" fill="none" />
  <!-- Dimple -->
  <path d="M 268 198 C 274 202 278 207 276 212" class="stroke-main" stroke-width="5" fill="none" />
</svg>
