<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finnian — Handmade Notebooks &amp; Small Tools</title>
    <meta name="author" content="Finnian" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Finnian's handmade sketchbook portfolio: small tools I actually use (Fit-Agent, calisthenics-log) and playful web experiments." />
    <meta property="og:title" content="Finnian — Handmade Notebooks &amp; Small Tools" />
    <meta property="og:description" content="An ordinary maker tinkering with small tools, cats, coffee, street workout, and tactile web experiments from Dongguan." />
    <meta property="og:type" content="website" />
    <script>
      // 首屏前定语言：只决定 <html lang> 与其中文字体族，文案由 src/shared/i18n.ts 接管
      (function () {
        var saved = localStorage.getItem('lang');
        var zh = saved ? saved === 'zh' : /^zh/i.test(navigator.language);
        document.documentElement.lang = zh ? 'zh-CN' : 'en';
        // 覆盖层只在 JS 可用时出现，无脚本环境直接露出正文
        document.documentElement.classList.add('js');
      })();
    </script>
    <style>
      /* loading 关键样式内联在 head：React 与 Lottie 就位之前就要压住首屏 */
      .brook-loader {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: none;
        place-content: center;
        justify-items: center;
        /* 底色与正文共用主题令牌，head 内联早于样式表时按亮色兜底 */
        background: var(--ll-desk, #fcfdfd);
      }
      .js .brook-loader { display: grid; }
      .brook-loader.is-hidden { display: none; }
      .brook-mark { width: clamp(150px, 26vmin, 240px); aspect-ratio: 1; }
      /* overflow 放行组装段拐杖自转时扫出方形画框的那一瞬 */
      .brook-mark svg { width: 100%; height: 100%; display: block; overflow: visible; }
    </style>
  </head>
  <body>
    <div class="brook-loader" id="brook-loader" aria-hidden="true">
      <div class="brook-mark" id="brook-mark"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
