<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finnian — Animation & Interaction Portfolio</title>
    <meta name="author" content="Finnian" />
    <meta name="description" content="Animation and interaction portfolio of Finnian — GSAP, Rive and Lottie driven experiments, based in Dongguan, China." />
    <meta property="og:title" content="Finnian — Animation &amp; Interaction Portfolio" />
    <meta property="og:description" content="GSAP, Rive, Lottie. Motion experiments from Dongguan." />
    <meta property="og:type" content="website" />
    <script>
      // 首屏前定语言：只决定 <html lang> 与其中文字体族，文案由 src/shared/i18n.ts 接管
      (function () {
        var saved = localStorage.getItem('lang');
        var zh = saved ? saved === 'zh' : /^zh/i.test(navigator.language);
        document.documentElement.lang = zh ? 'zh-CN' : 'en';
        // 覆盖层只在 JS 可用时出现，无脚本环境直接露出正文
        document.documentElement.classList.add('js');
      })();
    </script>
    <style>
      /* loading 关键样式内联在 head：React 与 Lottie 就位之前就要压住首屏 */
      .brook-loader {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: none;
        place-content: center;
        justify-items: center;
        gap: clamp(10px, 2.2vmin, 16px);
        background: #fafaf9;
      }
      .js .brook-loader { display: grid; }
      .brook-loader.is-hidden { display: none; }
      .brook-mark { width: clamp(150px, 26vmin, 240px); aspect-ratio: 1; }
      /* overflow 放行组装段拐杖自转时扫出方形画框的那一瞬 */
      .brook-mark svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .brook-caption {
        margin: 0;
        font-family: "Space Mono", ui-monospace, monospace;
        font-size: clamp(10px, 1.5vmin, 12px);
        letter-spacing: 0.18em;
        /* 字距会在末尾多留一格，起首补等宽把视觉中线挪回徽标轴上 */
        text-indent: 0.18em;
        text-transform: uppercase;
        color: rgba(20, 20, 20, 0.42);
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&family=Noto+Serif+SC:wght@300..900&family=Noto+Sans+SC:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="brook-loader" id="brook-loader" aria-hidden="true">
      <div class="brook-mark" id="brook-mark"></div>
      <p class="brook-caption" id="brook-caption">loading</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
